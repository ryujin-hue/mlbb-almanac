name: Deploy Worker + Site

# Deploy aplikasi MLBB Almanac (worker API + aset statik) ke Cloudflare Workers.
#
# Token dijangka sebagai secret repository:
#   CLOUDFLARE_API_TOKEN  - API token Cloudflare (Workers Scripts:Edit, Workers KV Storage:Edit)
#   CLOUDFLARE_ACCOUNT_ID - account id Cloudflare
#
# Deploy juga boleh dibuat terus dari mesin lokal:
#   cd live/worker && npm install && npm run deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "live/web/**"
      - "live/worker/**"
      - "packages/shared/**"
      - "live/wrangler.jsonc"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  # Sama dengan deploy-pages: API Cloudflare rate-limit (code 10429) bila
  # dua deploy Cloudflare jalan serentak.
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Asset arkib dijana DULU daripada build (public/ -> site/).
      - name: Jana aset arkib (sejarah patch -> web/public/archive)
        working-directory: live
        run: python3 tools/build_archive.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build web (site/)
        working-directory: live/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Workers Static Assets tidak perlukan _redirects: SPA dilayan oleh
      # `assets.not_found_handling = single-page-application` dalam
      # live/wrangler.jsonc. Malah, fail itu ditolak validator Worker -
      # peraturan tangkapan `/*  /index.html  200` dikira gelung tak hingga
      # (code 100324), kerana ia.match juga /index.html itu sendiri.
      # _redirects kekal dalam site/ untuk Cloudflare Pages (fail berbeza).
      - name: Buang _redirects untuk deploy Worker
        working-directory: live
        run: |
          rm -f site/_redirects
          test ! -f site/_redirects || { echo "gagal buang _redirects"; exit 1; }
          echo "Worker guna not_found_handling, bukan _redirects."

      - name: Semak secret Cloudflare
        id: secret
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::warning::Secret CLOUDFLARE_API_TOKEN belum ditetapkan - deploy dilangkau. Set secret itu di Settings > Secrets > Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Secret runtime Worker. Token PandaScore membolehkan /api/tournaments
      # menarik jadual tournament MLBB; tanpa token, endpoint itu menjawab
      # "no_token" dengan jujur - bukan 500.
      #
      # Input `secrets:` pada wrangler-action mencari NAMA pemboleh ubah
      # persekitaran, bukan nilainya - jadi ia tidak boleh digunakan untuk
      # secret GitHub. API Cloudflare terus lebih jelas dan tidak bergantung
      # pada versi action.
      - name: Set secret runtime Worker (PandaScore)
        if: steps.secret.outputs.skip != 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_API_TOKEN }}
        run: |
          if [ -z "$PANDASCORE_TOKEN" ]; then
            echo "::warning::Secret PANDASCORE_API_TOKEN belum ditetapkan - endpoint /api/tournaments akan jawab no_token."
            exit 0
          fi
          payload=$(jq -nc --arg t "$PANDASCORE_TOKEN" '{name:"PANDASCORE_API_TOKEN",text:$t,type:"secret_text"}')
          curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/mlbb-data-workflow/secrets" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" | jq -r '.success'
          echo "Secret PANDASCORE_API_TOKEN ditetapkan."

      # Secret refresh manual. Tanpa secret ini, `POST /api/refresh` ditutup
      # (503) - ia menulis ke KV, jadi ia mesti sentiasa proving.
      - name: Set secret runtime Worker (REFRESH_API_TOKEN)
        if: steps.secret.outputs.skip != 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_API_TOKEN }}
        run: |
          if [ -z "$REFRESH_TOKEN" ]; then
            echo "::warning::Secret REFRESH_API_TOKEN belum ditetapkan - POST /api/refresh akan ditutup (503)."
            exit 0
          fi
          payload=$(jq -nc --arg t "$REFRESH_TOKEN" '{name:"REFRESH_API_TOKEN",text:$t,type:"secret_text"}')
          curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/mlbb-data-workflow/secrets" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" | jq -r '.success'
          echo "Secret REFRESH_API_TOKEN ditetapkan."

      - name: Deploy ke Cloudflare Workers
        if: steps.secret.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # WAJIB wrangler 4: config repo ialah wrangler.jsonc (JSONC) dan guna
          # `assets.run_worker_first` sebagai array - wrangler 3 tak boleh
          # parse dua-dua itu (rangkum "Missing entry-point").
          wranglerVersion: "4.152.0"
          # workingDirectory = live/ supaya wrangler jumpa live/wrangler.jsonc
          # sebagai config root (path relatif: main = worker/src/index.ts,
          # assets = ./site). Config itu mengandungi relative path, jadi ia
          # kekal sah walaupun repositori dipindah ke live/.
          workingDirectory: live
