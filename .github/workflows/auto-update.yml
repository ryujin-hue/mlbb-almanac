name: auto-update

# Daily automatic data update: detects new patches / heroes / items / spells on
# mlbbhub.com and appends them to the CSV datasets, then refreshes the static
# API mirror and commits. Runs at 02:00 Asia/Kuala_Lumpur (18:00 UTC) and can
# be triggered manually from the Actions tab.
#
# Semua dataset dan skrip berada dalam archive/ (subpohon mlbb-historical-database).

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: archive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps (for static mirror rebuild)
        run: pip install -r api/requirements.txt

      - name: Run updater
        run: python3 scripts/update_data.py

      - name: Run test suite
        run: python3 -m pytest tests/ -q

      - name: Commit and push if data changed
        working-directory: .
        run: |
          git config user.name "mlbb-auto-updater"
          git config user.email "actions@users.noreply.github.com"
          # Skop kepada archive/ sahaja - live/ dan packages/ tidak boleh
          #conesel changed oleh updater data.
          git add archive/
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "[auto-update] data refresh $(date -u +%F)"
            # Kalau branch bergerak selama job berjalan, rebase lalu push ulang
            # daripada gagal dan menggagalkan pipeline harian.
            if ! git push; then
              echo "::warning::push ditolak, mencoba rebase ke origin/main"
              git fetch --unshallow origin main || git fetch origin main
              git rebase "origin/main" && git push
            fi
          fi
