name: QA Site

on:
  push:
    branches: [main]
    paths:
      - "live/web/**"
      - "live/worker/**"
      - "live/pages/**"
      - "live/tools/**"
      - "live/tests/**"
      - "packages/shared/**"
      - "archive/**"
      - ".github/workflows/qa-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-site
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --- worker ---
      - name: Worker unit test (jalankan normalizer sungguhan vs upstream)
        working-directory: live/worker
        run: npm install --no-audit --no-fund && npm test

      - name: Worker typecheck
        working-directory: live/worker
        run: npm run typecheck

      # --- pages functions ---
      - name: Install pages dependencies
        working-directory: live/pages
        run: npm install --no-audit --no-fund

      - name: Pages typecheck (proxy + penjana kad OG)
        working-directory: live/pages
        run: npm run typecheck

      # --- unit test logik tulen (shared + pages) ---
      - name: Unit test shared + pages (vitest)
        working-directory: .
        run: npm install --no-audit --no-fund && npm test

      # --- web ---
      - name: Install web dependencies
        working-directory: live/web
        run: npm install --no-audit --no-fund

      - name: Unit test web (vitest + testing-library)
        working-directory: live/web
        run: npm test

      # Asset arkib dijana DULU daripada build: `npm run build` menyalin
      # web/public/ ke site/, jadi JSON arkib mesti wujud sebelum itu.
      - name: Jana aset arkib (sejarah patch -> web/public/archive)
        working-directory: live
        run: python3 tools/build_archive.py

      - name: Web typecheck + build
        working-directory: live/web
        run: npm run build

      - name: Cek ukuran bundle
        working-directory: live
        run: |
          # Bundle JS/CSS dikira TANPA aset kandungan:
          #   audio  - lagu hero ~4.8 MB, bukan bundle kod
          #   archive- arkib (3.7 MB JSON + imej), bukan bundle kod
          #   og     - font DejaVu untuk kad OG, hanya diambil oleh
          #             Pages Function, bukan oleh pelayar
          # Recharts (carta korelasi) berada dalam chunk berasingan yang
          # dimuat secara lazy - jadi bundle UTAMA kekal kecil, tetapi
          # saiz site/ keseluruhan bertambah.
          total=$(du -sk --exclude=audio --exclude=archive --exclude=og site | cut -f1)
          echo "site/ (tanpa audio, arkib, og): ${total} KB"
          test "$total" -lt 1900 || { echo "Bundle kegedean (>1.9 MB)"; exit 1; }
          if [ -d site/audio ]; then
            echo "site/audio/: $(du -sk site/audio | cut -f1) KB"
          fi
          if [ -d site/archive ]; then
            echo "site/archive/: $(du -sk site/archive | cut -f1) KB"
          fi
          if [ -d site/og ]; then
            echo "site/og/: $(du -sk site/og | cut -f1) KB"
          fi

      - name: Cek aset lagu hero
        working-directory: live
        run: |
          test -d site/audio/PICS || { echo "folder aset audio hilang"; exit 1; }
          # Nama folder mengandungi koma dan ruang - jangan diubah.
          test -f "site/audio/PICS/Mathilda/336387.mp3" || { echo "fail audio Mathilda hilang"; exit 1; }
          test -f "site/audio/PICS/Miya,layla/336388.mp3" || { echo "fail audio Miya/Layla hilang"; exit 1; }
          test -f "site/audio/PICS/Vexana,Valentina/336390.mp3" || { echo "fail audio Vexana/Valentina hilang"; exit 1; }
          test -f "site/audio/PICS/Bruno,nolan,Fredrinn,aamon,brody/Tik4Down_01_emergency_-_breakbeat_breakbeat.mp3" || { echo "fail audio Bruno hilang"; exit 1; }
          test -f "site/audio/PICS/Camila,hanabi,alice,edith/Tik4Down_02_fanny_skin_aspirant_kau_pikir_hidup_ini_cuma_makan_batu_danc.mp3" || { echo "fail audio Camila hilang"; exit 1; }
          test -f "site/audio/PICS/Dori,hirara,zetian,fanny ,floryn/Tik4Down_03_pinjem_helm_yah_riri_jipon.mp3" || { echo "fail audio Dori hilang"; exit 1; }
          echo "Aset lagu hero OK."

      # --- smoke test browser ---
      - name: Install Playwright
        working-directory: live
        run: |
          python3 -m pip install --upgrade pip
          pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Smoke test MLBB Almanac
        working-directory: live
        run: python3 tests/smoke_test_v2.py

      # --- keamanan ---
      - name: Scan kebocoran secret
        working-directory: .
        run: |
          # Corak dipecah supaya baris ini sendiri TIDAK match corak scan.
          # Sebelum ini, fail workflow ini match corak sebab corak mengandungi
          # nama prefix token secara literal - jadi scan gagal walaupun repo
          # benar-benar bersih.
          PATTERN="ghp_""[A-Za-z0-9]{20,}|github_""pat_|-----BEGIN [A-Z ]*PRIVATE KEY-----"
          if grep -rIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=site \
            -E "$PATTERN" .; then
            echo "Secret terdeteksi di repository!"
            exit 1
          fi
          echo "Tidak ada secret yang terdeteksi."

      - name: Cek header keamanan
        working-directory: live
        run: |
          test -f site/_headers || { echo "site/_headers hilang"; exit 1; }
          grep -q "Content-Security-Policy" site/_headers || { echo "CSP tidak ada"; exit 1; }
          grep -q "script-src 'self'" site/_headers || { echo "script-src harus 'self'"; exit 1; }
          echo "Header keamanan OK."
