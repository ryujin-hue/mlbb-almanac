name: Deploy Pages

# Deploy bahagian statik MLBB Almanac ke Cloudflare Pages.
#
# Pages hanya boleh layan fail statik + Pages Functions. API sebenar (KV,
# cron 02:00 UTC, upstream fetch) kekal hidup di Worker — jadi
# `pages/functions/` memproksikan /api/* dan /audio/* ke sana. Browser tetap
# satu origin: tiada CORS, tiada perubahan pada client.
#
# Token dijangka sebagai secret repository (sama seperti deploy Worker):
#   CLOUDFLARE_API_TOKEN  - API token Cloudflare (Workers Scripts:Edit,
#                           Workers KV Storage:Edit, Cloudflare Pages:Edit)
#   CLOUDFLARE_ACCOUNT_ID - account id Cloudflare
#
# TOKEN PERLU SKOPE "Cloudflare Pages:Edit" — token yang hanya ada
# "Workers Scripts:Edit" akan ditolak dengan "Authentication error".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "pages/**"
      - "shared/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web (site/)
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Semak secret Cloudflare
        id: secret
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::warning::Secret CLOUDFLARE_API_TOKEN belum ditetapkan - deploy dilangkau. Set secret itu di Settings > Secrets > Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pastikan projek Pages wujud
        if: steps.secret.outputs.skip != 'true'
        working-directory: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # "project already exists" adalah hasil yang dijangka - abaikan sahaja.
          npx --yes wrangler@4.152.0 pages project create mlbb-almanac \
            --production-branch=main || echo "projek dah wujud - sambung"

      - name: Deploy ke Cloudflare Pages
        if: steps.secret.outputs.skip != 'true'
        working-directory: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler 4.152.0 - sama versi yang di pin dalam deploy.yml.
          # Config pages/wrangler.toml nyatakan pages_build_output_dir="../site"
          # dan Pages Functions dijumpai dalam pages/functions/.
          npx --yes wrangler@4.152.0 pages deploy \
            --project-name=mlbb-almanac \
            --branch=main \
            --commit-dirty=true
