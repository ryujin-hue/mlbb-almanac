name: Deploy Pages

# Deploy bahagian statik MLBB Almanac ke Cloudflare Pages.
#
# Pages hanya boleh layan fail statik + Pages Functions. API sebenar (KV,
# cron 02:00 UTC, upstream fetch) kekal hidup di Worker — jadi
# `live/pages/functions/` memproksikan /api/* dan /audio/* ke sana. Browser
# kekal satu origin: tiada CORS, tiada perubahan pada client.
#
# Token dijangka sebagai secret repository (sama seperti deploy Worker):
#   CLOUDFLARE_API_TOKEN  - API token Cloudflare (Workers Scripts:Edit,
#                           Workers KV Storage:Edit, Cloudflare Pages:Edit)
#   CLOUDFLARE_ACCOUNT_ID - account id Cloudflare
#
# TOKEN PERLU SKOPE "Cloudflare Pages:Edit" — token yang hanya ada
# "Workers Scripts:Edit" akan ditolak dengan "Authentication error".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "live/web/**"
      - "live/pages/**"
      - "live/tools/**"
      - "packages/shared/**"
      # Arkib dibina daripada archive/ - kemas kini harian mesti sampai ke laman.
      - "archive/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

concurrency:
  # Kumpulan yang sama dengan deploy Worker: API Cloudflare rate-limit
  # (code 10429) bila dua deploy Cloudflare jalan serentak.
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Asset arkib dijana DULU daripada build (public/ -> site/).
      - name: Jana aset arkib (sejarah patch -> web/public/archive)
        working-directory: live
        run: python3 tools/build_archive.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pages Functions dibungkus dengan esbuild. resvg-wasm (rasterizer
      # WASM untuk kad OG) diimport sebagai modul `.wasm`, jadi bundle
      # Pages menghasilkan index.js + satu fail .wasm berasingan.
      - name: Install pages dependencies
        working-directory: live/pages
        run: npm install --no-audit --no-fund

      - name: Build web (site/)
        working-directory: live/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Semak Pages Functions dibina dengan baik
        working-directory: live/pages
        run: |
          npm run typecheck
          npx --yes wrangler@4.152.0 pages functions build --outdir=/tmp/pg-build
          test -f /tmp/pg-build/index.js || { echo "bundle Pages Functions hilang"; exit 1; }

          # Skrip JS mesti KECIL. Runtime Cloudflare melarang kodegen WASM
          # dinamik, jadi modul WAJA mesti di-import sebagai modul (bukan
          # bait mentah yang di-fetch pada runtime) - esbuild Pages
          # mengeluarkannya sebagai fail .wasm berasingan.
          jskb=$(du -sk /tmp/pg-build/index.js | cut -f1)
          echo "bundle JS Pages Functions: ${jskb} KB"
          test "$jskb" -lt 400 || { echo "Bundle JS kegedean"; exit 1; }

          wasmfile=$(find /tmp/pg-build -maxdepth 1 -name '*.wasm' | head -1)
          test -n "$wasmfile" || { echo "Modul WASM hilang - kad OG tidak berfungsi"; exit 1; }
          echo "modul WASM: $(basename "$wasmfile") ($(du -sk "$wasmfile" | cut -f1) KB)"

          # Font TTF mesti ada dalam site/ - runtime tiada font sistem.
          test -f ../site/og/DejaVuSans-Bold.ttf || { echo "site/og/DejaVuSans-Bold.ttf hilang"; exit 1; }
          echo "Aset kad OG OK."

      - name: Semak secret Cloudflare
        id: secret
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::warning::Secret CLOUDFLARE_API_TOKEN belum ditetapkan - deploy dilangkau. Set secret itu di Settings > Secrets > Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pastikan projek Pages wujud
        if: steps.secret.outputs.skip != 'true'
        working-directory: live/pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # "project already exists" adalah hasil yang dijangka. Rate limit
          # (code 10429) juga dijangka bila ada deploy Cloudflare lain
          # berjalan serentak - cuba semula dengan jeda.
          for i in 1 2 3; do
            if npx --yes wrangler@4.152.0 pages project create mlbb-almanac \
                 --production-branch=main 2>&1 | tee /tmp/pc.log; then
              echo "projek_pages=sahaja" >> "$GITHUB_OUTPUT"
              break
            fi
            if grep -qi "already exists" /tmp/pc.log; then
              echo "projek_pages=wujud" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "::warning::gagal cemented #$i - cuba semula"
            sleep 20
          done

      - name: Deploy ke Cloudflare Pages
        if: steps.secret.outputs.skip != 'true'
        working-directory: live/pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler 4.152.0 - sama versi yang di pin dalam deploy.yml.
          # Config live/pages/wrangler.jsonc nyatakan pages_build_output_dir
          #="../site" (live/site) dan Pages Functions dijumpai dalam
          # live/pages/functions/. Config itu menang atas live/wrangler.jsonc
          # sebab ia berada dalam direktori kerja semasa.
          npx --yes wrangler@4.152.0 pages deploy \
            --project-name=mlbb-almanac \
            --branch=main \
            --commit-dirty=true
